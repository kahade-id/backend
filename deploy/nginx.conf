# Nginx reverse proxy configuration for Kahade API.
# Handles HTTPS termination, proxy headers, and rate limiting.

# Rate limit zone must be declared at http{} context, not inside server{}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=1200r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

upstream kahade_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.kahade.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.kahade.id;

    # TLS — replace with your certificate paths
    ssl_certificate     /etc/letsencrypt/live/api.kahade.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kahade.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # Forward real client IP to Node.js
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Host               $http_host;

    # ─── Security Headers ─────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    # AUDIT (deploy config): the comment claims alignment with Express, but 10k is
    # 100x tighter than the app's documented 1mb JSON limit (main.ts) — oversized API
    # bodies were rejected by nginx with an opaque 413 before ever reaching validation.
    client_max_body_size 1m;

    # Rate limiting (outer defense; Express ThrottlerGuard is inner)
    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass         http://kahade_api;
        proxy_http_version 1.1;
        # AUDIT: `keepalive 32` in the upstream never worked — without clearing the
        # Connection header nginx sent `Connection: close` upstream on every request.
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /socket.io/ {
        limit_conn ws_conn 10;
        proxy_pass         http://kahade_api;
        proxy_http_version 1.1;
        # AUDIT: setting ANY proxy_set_header here suppresses inheritance of the
        # server-level ones — the WS handshake used to arrive without Host/X-Real-IP/
        # X-Forwarded-* , so express saw nginx's loopback IP as every client's source
        # (breaking WS-side IP logic and proto detection).
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $http_host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 60s;
    }

    # Midtrans webhook — its own generous zone (uses signature verification upstream).
    # AUDIT: `limit_req` declared in server{} is *inherited* by every location, so the
    # old "exempt" comment was false — the shared api_limit zone throttled the webhook.
    location /v1/payments/midtrans-webhook {
        limit_req zone=webhook_limit burst=100 nodelay;
        client_max_body_size 64k;
        proxy_pass         http://kahade_api;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host              $http_host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /v1/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://kahade_api;
        proxy_http_version 1.1;
    }
}
